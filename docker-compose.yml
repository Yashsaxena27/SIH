
services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_password}
      POSTGRES_DB: ${POSTGRES_DB:-sih_db}
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    command: >
      bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Fallbacks if .env is missing
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sih_user}:${POSTGRES_PASSWORD:-sih_password}@db:5432/${POSTGRES_DB:-sih_db}
      - JWT_SECRET=${JWT_SECRET:-supersecret_demo_key}
      - DEMO_MODE=${DEMO_MODE:-true}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000
      - MOCK_ML_MODE=false
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_USE_MOCK_DATA=false
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgis_data:
  redis_data:
