<!DOCTYPE html>
<html>
<head>
    <title>SIH Urban Intelligence Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #000; color: white; }
        #map { width: 100vw; height: 100vh; }
        .header { position: absolute; top: 20px; left: 50px; z-index: 1000; background: rgba(20,20,25,0.9); padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 1px; color: #fff; }
        
        /* Leaflet popup dark theme */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1a1b1e; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .custom-popup .title { font-weight: bold; margin-bottom: 5px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .custom-popup .stats { font-size: 12px; color: #aaa; margin-top: 8px; }
        .custom-popup img { width: 100%; border-radius: 6px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.1); }
        
        .severity-minor { color: #00e676; }
        .severity-moderate { color: #ffaa00; }
        .severity-severe { color: #ff5e5e; }
    </style>
</head>
<body>

<div class="header">
    <h1>SIH Command Center: Live Road Diagnostics</h1>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Initialize map (Centered on India approx)
    const map = L.map('map').setView([21.1458, 79.0882], 5);

    // Dark canvas theme map tiles
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri, HERE, Garmin, FAO, NOAA, USGS',
        maxZoom: 19
    }).addTo(map);

    // Fetch hotspots from the backend
    fetch('/api/hotspots')
        .then(response => response.json())
        .then(data => {
            if (!data.features || data.features.length === 0) {
                console.log("No hotspots found yet.");
                return;
            }

            // Create markers for each hotspot
            L.geoJSON(data, {
                pointToLayer: function (feature, latlng) {
                    const sev = feature.properties.severity;
                    let color = '#00e676'; // minor
                    if (sev === 'moderate') color = '#ffaa00';
                    if (sev === 'severe') color = '#ff5e5e';
                    
                    const markerHtmlStyles = `
                      background-color: ${color};
                      width: 20px;
                      height: 20px;
                      display: block;
                      left: -10px;
                      top: -10px;
                      position: relative;
                      border-radius: 50%;
                      border: 2px solid #fff;
                      box-shadow: 0 0 15px ${color};
                      opacity: 0.8;
                    `;

                    const icon = L.divIcon({
                        className: "custom-pin",
                        iconAnchor: [0, 24],
                        popupAnchor: [0, -36],
                        html: `<span style="${markerHtmlStyles}" />`
                    });

                    return L.marker(latlng, { icon: icon });
                },
                onEachFeature: function (feature, layer) {
                    const props = feature.properties;
                    const sevClass = `severity-${props.severity}`;
                    
                    let popupContent = `
                        <div class="custom-popup">
                            <div class="title ${sevClass}">${props.severity.toUpperCase()} HOTSPOT</div>
                            <div class="stats">
                                <b>Events Detected:</b> ${props.event_count}<br/>
                                <b>Damage Types:</b> ${props.classes_detected.join(', ')}<br/>
                            </div>
                        </div>
                    `;
                    layer.bindPopup(popupContent);
                }
            }).addTo(map);
            
            // Auto-zoom to fit all hotspots if they exist
            const bounds = L.geoJSON(data).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        })
        .catch(err => console.error("Error loading hotspots:", err));
</script>

</body>
</html>
